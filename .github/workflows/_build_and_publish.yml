name: Build and Publish Image

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      tags:
        description: 'Space-separated tags to publish'
        required: true
        type: string
      create_release:
        description: 'Whether to create a GitHub Release'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Whether the release is a prerelease'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Git tag for GitHub Release'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.repository_owner != 'docmost'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: false

      - name: Checkout available submodules
        run: |
          git submodule sync
          git submodule update --init tools/agent-toolkit 2>/dev/null || true

      - name: Set lowercased image name
        run: echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error

      - name: Determine image export tags
        if: inputs.create_release
        id: export-tags
        run: |
          EXPORT_TAGS=()
          for tag in ${{ inputs.tags }}; do
            EXPORT_TAGS+=("ghcr.io/${IMAGE_NAME}:${tag}")
          done
          {
            echo "tags<<EOF"
            printf "%s\n" "${EXPORT_TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Export Docker image
        if: inputs.create_release
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.export-tags.outputs.tags }}
          outputs: type=docker,dest=docmost-${{ matrix.suffix }}.docker.tar
          cache-from: type=gha,scope=${{ matrix.suffix }}

      - name: Compress image
        if: inputs.create_release
        run: gzip docmost-${{ matrix.suffix }}.docker.tar

      - name: Upload image archive
        if: inputs.create_release
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.suffix }}
          path: docmost-${{ matrix.suffix }}.docker.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository_owner != 'docmost'
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercased image name
        run: echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG_FLAGS=()
          for tag in ${{ inputs.tags }}; do
            TAG_FLAGS+=("-t" "ghcr.io/${IMAGE_NAME}:${tag}")
          done
          docker buildx imagetools create "${TAG_FLAGS[@]}" \
            $(printf 'ghcr.io/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Download image archives
        if: inputs.create_release
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          path: /tmp/images
          merge-multiple: true

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.is_prerelease }}
          files: |
            /tmp/images/docmost-amd64.docker.tar.gz
            /tmp/images/docmost-arm64.docker.tar.gz
          draft: true
